<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Fundo circular com borda sutil -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="url(#gradBg)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Prédio / Indústria estilizada ao fundo -->
  <path d="M12 48 L12 28 L24 28 L24 48 Z" fill="#334155" opacity="0.8"/>
  <path d="M24 48 L24 20 L36 20 L36 48 Z" fill="#475569" opacity="0.9"/>
  <!-- Janelas da indústria -->
  <rect x="15" y="32" width="3" height="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="19" y="32" width="3" height="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="27" y="24" width="3" height="4" fill="#fbbf24" opacity="0.9"/>
  <rect x="31" y="24" width="3" height="4" fill="#fbbf24" opacity="0.9"/>
  <rect x="27" y="32" width="3" height="4" fill="#fbbf24" opacity="0.9"/>
  <rect x="31" y="32" width="3" height="4" fill="#fbbf24" opacity="0.9"/>
  <!-- Maleta / Símbolo do Trabalho -->
  <rect x="22" y="34" width="32" height="20" rx="3" fill="url(#gradCase)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Alça da maleta -->
  <path d="M32 34 L32 30 C32 28.5 33.5 27 35 27 L41 27 C42.5 27 44 28.5 44 30 L44 34" fill="none" stroke="#d97706" stroke-width="2"/>
  <!-- Faixa central e fecho -->
  <line x1="22" y1="42" x2="54" y2="42" stroke="#78350f" stroke-width="1.5"/>
  <rect x="36" y="40" width="4" height="4" rx="1" fill="#fef3c7" stroke="#92400e" stroke-width="0.8"/>
  <!-- Indicador de crescimento / gráfico verde -->
  <polyline points="10,24 20,18 32,22 44,12 52,14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="14" r="3" fill="#4ade80"/>
</svg>
